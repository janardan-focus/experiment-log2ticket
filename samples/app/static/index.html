<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log2Ticket — LLM ticket-writing demo</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>Log2Ticket</h1>
  <span class="sub">break something, then watch an LLM write the ticket for it</span>
  <span id="badge" class="badge" aria-live="polite">…</span>
</header>

<main>
  <section class="left">
    <h2>1 · Break something</h2>
    <div id="buttons"></div>

    <h2 style="margin-top:26px">2 · Write the ticket</h2>
    <button class="run" id="run" type="button">
      <span class="t">Write a ticket for the latest error</span>
      <span class="d">assemble context, then ask the LLM</span>
    </button>
    <button id="inspect" type="button">
      <span class="t">Show context only</span>
      <span class="d">no LLM call, no API key needed</span>
    </button>
  </section>

  <section class="right" id="out" aria-live="polite">
    <p class="empty">Trigger an error on the left to begin.</p>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
